name: Deploy shared showcase

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            hobbit-threejs/luna/package-lock.json
            hobbit-threejs/sol/package-lock.json
            hobbit-threejs/astra/package-lock.json
            hobbit-threejs/terra/package-lock.json

      - name: Install Luna dependencies
        working-directory: hobbit-threejs/luna
        run: npm ci

      - name: Test Luna
        working-directory: hobbit-threejs/luna
        run: npm test

      - name: Build Luna
        working-directory: hobbit-threejs/luna
        run: npm run build
        env:
          VITE_BASE: ./

      - name: Install Sol dependencies
        working-directory: hobbit-threejs/sol
        run: npm ci

      - name: Test Sol
        working-directory: hobbit-threejs/sol
        run: npm test

      - name: Build Sol
        working-directory: hobbit-threejs/sol
        run: npm run build
        env:
          VITE_BASE: ./

      - name: Install Astra dependencies
        working-directory: hobbit-threejs/astra
        run: npm ci

      - name: Test Astra
        working-directory: hobbit-threejs/astra
        run: npm test

      - name: Build Astra
        working-directory: hobbit-threejs/astra
        run: npm run build

      - name: Install Terra dependencies
        working-directory: hobbit-threejs/terra
        run: npm ci

      - name: Test Terra
        working-directory: hobbit-threejs/terra
        run: npm test -- --run

      - name: Build Terra
        working-directory: hobbit-threejs/terra
        run: npm run build

      - name: Test Pages assembler
        run: node --test scripts/assemble-pages.test.mjs

      - name: Assemble Pages artifact
        run: node scripts/assemble-pages.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
